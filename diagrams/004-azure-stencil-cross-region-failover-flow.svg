<text x="50" y="244" fill="#cbd5e1" font-size="11.5">&#x2022; Azure Front Door marks primary origin unhealthy</text>
<text x="50" y="268" fill="#cbd5e1" font-size="11.5">&#x2022; Container Apps ingress probes return HTTP 504</text>
<text x="50" y="292" fill="#cbd5e1" font-size="11.5">&#x2022; DR Co-Worker awakens in isolated control subnet</text>

      
