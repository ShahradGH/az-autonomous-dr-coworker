<text x="756" y="244" fill="#cbd5e1" font-size="11.5">&#x2022; Ensures microservices do not resolve to UK South</text>
<text x="756" y="268" fill="#cbd5e1" font-size="11.5">&#x2022; Verifies ExpressRoute gateway load is &lt; 50%</text>
<text x="756" y="292" fill="#cbd5e1" font-size="11.5">&#x2022; Asserts zero asymmetric hairpinning routes</text>

      
