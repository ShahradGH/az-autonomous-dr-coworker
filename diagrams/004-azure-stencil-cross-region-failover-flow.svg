      <text x="1115" y="796" fill="#cbd5e1" font-size="11">&#x2022; Zero Split-Brain Outage</text>
      <text x="1115" y="818" fill="#94a3b8" font-size="10.5">RTO: 110s | Data Loss: 0 bytes</text>
      
