<text x="403" y="244" fill="#cbd5e1" font-size="11.5">&#x2022; Interrogates Cosmos DB ReplicationLagSeconds</text>
<text x="403" y="268" fill="#cbd5e1" font-size="11.5">&#x2022; If lag &gt; 30s: HARD VETO on automated cutover</text>
<text x="403" y="292" fill="#cbd5e1" font-size="11.5">&#x2022; Waits for write queue catch-up (38.4s -&gt; &lt;5s)</text>

      
      <rect x="399" y="750" width="288" height="86" rx="6" fill="#0b1329" stroke="#f59e0b" stroke-width="1.5"/>
